name: Unicorn Release Build

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  macos:
    name: macOS XCFramework (All Apple Platforms)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Build Unicorn XCFramework
        env:
          UNICORN_LOGGING: "OFF"
        run: |
          chmod +x build_xcframework.sh
          ./build_xcframework.sh

      - name: Package XCFramework bundle
        shell: bash
        run: |
          (cd build && zip -r ../Unicorn.xcframework.zip Unicorn.xcframework)
          openssl dgst -sha256 Unicorn.xcframework.zip

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-xcframework
          path: Unicorn.xcframework.zip

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            cmake_flags: ""
            packages: ""
          - arch: aarch64
            cmake_flags: "-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64"
            packages: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
          - arch: armv7
            cmake_flags: "-DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm"
            packages: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
          - arch: i686
            cmake_flags: "-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32"
            packages: "gcc-multilib g++-multilib"
          - arch: riscv64
            cmake_flags: "-DCMAKE_C_COMPILER=riscv64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=riscv64-linux-gnu-g++ -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=riscv64"
            packages: "gcc-riscv64-linux-gnu g++-riscv64-linux-gnu"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Install dependencies
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build static library
        run: |
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_ARCH=aarch64 \
            -DUNICORN_LEGACY_STATIC_ARCHIVE=ON \
            -DUNICORN_BUILD_TESTS=OFF \
            -DUNICORN_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=install \
            ${{ matrix.cmake_flags }}
          cmake --build build --config Release -j$(nproc)
          cmake --install build

      - name: Package Linux artifact
        run: |
          cd install && tar -czvf ../unicorn-linux-${{ matrix.arch }}.tar.gz * && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-linux-${{ matrix.arch }}
          path: unicorn-linux-${{ matrix.arch }}.tar.gz

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
          - abi: armeabi-v7a
          - abi: x86_64
          - abi: x86
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Build Android static library
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_ARCH=aarch64 \
            -DUNICORN_LEGACY_STATIC_ARCHIVE=ON \
            -DUNICORN_BUILD_TESTS=OFF \
            -DUNICORN_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --config Release -j$(nproc)
          cmake --install build

      - name: Package Android artifact
        run: |
          cd install && tar -czvf ../unicorn-android-${{ matrix.abi }}.tar.gz * && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-android-${{ matrix.abi }}
          path: unicorn-android-${{ matrix.abi }}.tar.gz

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_arch: "-A x64"
          - arch: x86
            cmake_arch: "-A Win32"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Build static library
        run: |
          cmake -B build ${{ matrix.cmake_arch }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DUNICORN_ARCH=aarch64 `
            -DUNICORN_LEGACY_STATIC_ARCHIVE=ON `
            -DUNICORN_BUILD_TESTS=OFF `
            -DUNICORN_INSTALL=ON `
            -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --config Release --parallel
          cmake --install build --config Release

      - name: Package Windows artifact
        run: |
          Compress-Archive -Path install\* -DestinationPath unicorn-windows-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-windows-${{ matrix.arch }}
          path: unicorn-windows-${{ matrix.arch }}.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          cd release
          for f in *; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Create or Update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
